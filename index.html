<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY魔法數學 · 暑假補課回報單</title>
<style>
  :root{
    --sun-yellow:#FFC01E;
    --sun-orange:#F5952B;
    --sun-red:#F0644B;
    --ink:#4A3A2A;
    --ink-soft:#8A7660;
    --cream:#FFF8EC;
    --card:#FFFFFF;
    --line:#F0E3CE;
    --ok:#4CA66B;
    --warn:#E8804A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -200px, #FFE9B8 0%, rgba(255,233,184,0) 60%),
      var(--cream);
    color:var(--ink);
    line-height:1.6;
    padding:0 0 40px;
  }
  .wrap{max-width:460px;margin:0 auto;padding:0 16px;}

  /* Header */
  .hero{text-align:center;padding:26px 0 14px;}
  .hero img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(240,150,43,.25));}
  .hero h1{
    margin:8px 0 2px;font-size:22px;font-weight:800;letter-spacing:1px;
    color:var(--sun-orange);
  }
  .hero .sub{
    display:inline-block;margin-top:4px;font-size:13px;font-weight:700;
    color:#fff;background:linear-gradient(135deg,var(--sun-orange),var(--sun-red));
    padding:4px 14px;border-radius:999px;letter-spacing:.5px;
    box-shadow:0 4px 10px rgba(240,100,75,.3);
  }

  /* Card */
  .card{
    background:var(--card);border-radius:20px;padding:20px 18px;
    box-shadow:0 8px 24px rgba(180,140,80,.12);
    border:1px solid var(--line);
    margin-top:16px;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label.q{
    display:block;font-size:15px;font-weight:800;margin-bottom:8px;color:var(--ink);
  }
  label.q .star{color:var(--sun-red);margin-left:2px;}
  .hint{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:6px;}

  input[type=text],input[type=date],input[type=time],textarea,select{
    width:100%;font-size:16px;font-family:inherit;color:var(--ink);
    background:var(--cream);border:2px solid var(--line);border-radius:12px;
    padding:12px 14px;outline:none;transition:border-color .15s,background .15s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--sun-orange);background:#fff;}
  textarea{resize:none;min-height:76px;}
  select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23F5952B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;
  }
  .time-row{display:flex;gap:10px;align-items:flex-end;}
  .time-row .col{flex:1;}
  .time-row .col small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:5px;}
  .dur{
    text-align:center;font-size:13px;font-weight:800;color:var(--sun-orange);
    margin-top:8px;min-height:18px;
  }

  /* Segmented toggle */
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    padding:12px 0;border-radius:12px;border:2px solid var(--line);
    background:var(--cream);color:var(--ink-soft);transition:all .15s;
  }
  .seg button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 10px rgba(76,166,107,.3);}
  .seg button.on-warn{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 4px 10px rgba(232,128,74,.3);}
  .seg button.on-neutral{background:var(--sun-orange);border-color:var(--sun-orange);color:#fff;box-shadow:0 4px 10px rgba(245,149,43,.3);}

  .reveal{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .reveal.show{max-height:220px;margin-top:12px;}

  /* Signature */
  .sig-wrap{position:relative;}
  canvas{
    width:100%;height:150px;background:var(--cream);border:2px dashed var(--sun-orange);
    border-radius:12px;touch-action:none;display:block;
  }
  .sig-clear{
    position:absolute;top:8px;right:8px;font-size:12px;font-weight:800;
    background:#fff;border:1px solid var(--line);color:var(--ink-soft);
    padding:5px 12px;border-radius:999px;cursor:pointer;
  }
  .sig-ph{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:var(--ink-soft);font-size:14px;font-weight:700;pointer-events:none;opacity:.55;
  }
  .check-row{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer;user-select:none;}
  .check-row .box{
    width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--cream);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
  }
  .check-row.on .box{background:var(--ok);border-color:var(--ok);}
  .check-row .box svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0;transition:opacity .15s;}
  .check-row.on .box svg{opacity:1;}
  .check-row span{font-size:15px;font-weight:800;}

  /* Actions */
  .actions{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
  .btn{
    font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;border:none;
    padding:16px;border-radius:14px;letter-spacing:.5px;transition:transform .1s,box-shadow .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-main{
    background:linear-gradient(135deg,var(--sun-yellow),var(--sun-orange));
    color:#fff;box-shadow:0 6px 16px rgba(245,149,43,.4);
  }
  .btn-sub{background:#fff;color:var(--sun-orange);border:2px solid var(--sun-orange);}
  .err{color:var(--sun-red);font-size:13px;font-weight:800;text-align:center;min-height:18px;margin-top:2px;}

  .foot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:18px;font-weight:600;}

  /* Capture card (hidden, rendered to image) */
  #capture{
    position:fixed;left:-9999px;top:0;width:440px;background:var(--cream);
    padding:24px;font-family:inherit;color:var(--ink);
  }
  #capture .cap-head{text-align:center;border-bottom:3px solid var(--sun-orange);padding-bottom:14px;margin-bottom:16px;}
  #capture .cap-head img{width:64px;height:64px;object-fit:contain;}
  #capture .cap-head h2{margin:6px 0 2px;color:var(--sun-orange);font-size:20px;font-weight:800;letter-spacing:1px;}
  #capture .cap-head .t{font-size:13px;color:var(--ink-soft);font-weight:700;}
  #capture .row{display:flex;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;}
  #capture .row .k{width:96px;flex-shrink:0;font-weight:800;color:var(--sun-orange);}
  #capture .row .v{flex:1;font-weight:600;word-break:break-word;}
  #capture .v.ok{color:var(--ok);font-weight:800;}
  #capture .v.warn{color:var(--warn);font-weight:800;}
  #capture .cap-sig{margin-top:14px;}
  #capture .cap-sig .k{font-weight:800;color:var(--sun-orange);font-size:15px;margin-bottom:6px;}
  #capture .cap-sig img{width:100%;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;}
  #capture .cap-foot{text-align:center;margin-top:14px;font-size:12px;color:var(--ink-soft);font-weight:700;}
</style>
</head>

    <h1>SUNNY魔法數學</h1>
    <div class="sub">暑假補課回報單</div>
  </div>

  <div class="card">
    <div class="field">
      <label class="q">班級<span class="star">*</span></label>
      <select id="grade">
        <option value="">請選擇班級</option>
        <option>三年級</option>
        <option>四年級</option>
        <option>五年級A班</option>
        <option>五年級B班</option>
        <option>六年級</option>
      </select>
    </div>

    <div class="field">
      <label class="q">學生姓名<span class="star">*</span></label>
      <input type="text" id="name" placeholder="請填寫姓名">
    </div>

    <div class="field">
      <label class="q">補課日期<span class="star">*</span></label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label class="q">課程單元<span class="star">*</span></label>
      <input type="text" id="unit" placeholder="例：因數與倍數（二）">
    </div>

    <div class="field">
      <label class="q">看影片時間<span class="star">*</span></label>
      <div class="time-row">
        <div class="col"><small>開始</small><input type="time" id="start"></div>
        <div class="col"><small>結束</small><input type="time" id="end"></div>
      </div>
      <div class="dur" id="dur"></div>
    </div>

    <div class="field">
      <label class="q">看完影片有沒有問題？<span class="star">*</span></label>
      <div class="seg" id="segQ">
        <button type="button" data-v="沒有問題" data-style="ok">沒有問題</button>
        <button type="button" data-v="有問題" data-style="warn">有問題</button>
      </div>
      <div class="reveal" id="qReveal">
        <textarea id="qText" placeholder="請寫下不懂的地方，老師會幫你解答"></textarea>
      </div>
    </div>

    <div class="field">
      <label class="q">這堂課的作業完成了嗎？<span class="star">*</span></label>
      <div class="seg" id="segHw">
        <button type="button" data-v="已完成" data-style="ok">已完成</button>
        <button type="button" data-v="未完成" data-style="warn">未完成</button>
      </div>
      <div class="reveal" id="hwReveal">
        <small style="display:block;font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:5px;">預計哪天完成？</small>
        <input type="date" id="hwDate">
      </div>
    </div>

    <div class="field">
      <label class="q">家長簽名<span class="star">*</span></label>
      <div class="sig-wrap">
        <canvas id="sig"></canvas>
        <span class="sig-ph" id="sigPh">請家長在此簽名</span>
        <button type="button" class="sig-clear" id="sigClear">清除重簽</button>
      </div>
      <div class="check-row" id="confirm">
        <div class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <span>家長已確認孩子完成補課</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <div class="err" id="err"></div>
    <button class="btn btn-main" id="btnImg">📸 產生截圖回傳 LINE</button>
    <button class="btn btn-sub" id="btnCopy">📋 複製文字摘要</button>
  </div>

  <div class="foot">SUNNY魔法數學 · 暑假在家補課，一起加油！☀️</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  // default date = today
  var today = new Date();
  var iso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  document.getElementById("date").value = iso;

  // duration calc
  var startEl=document.getElementById("start"), endEl=document.getElementById("end"), durEl=document.getElementById("dur");
  function calcDur(){
    if(startEl.value && endEl.value){
      var s=startEl.value.split(":"), e=endEl.value.split(":");
      var mins=(e[0]*60+ +e[1])-(s[0]*60+ +s[1]);
      if(mins<0) mins+=1440;
      var h=Math.floor(mins/60), m=mins%60;
      durEl.textContent="⏱ 共看了 "+(h?h+" 小時 ":"")+(m?m+" 分鐘":(h?"":"0 分鐘"));
    } else durEl.textContent="";
  }
  startEl.addEventListener("change",calcDur); endEl.addEventListener("change",calcDur);

  // segmented toggles
  var qVal="", hwVal="";
  function bindSeg(id, reveal, cb){
    var seg=document.getElementById(id);
    seg.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click",function(){
        seg.querySelectorAll("button").forEach(function(x){x.className="";});
        b.className = b.dataset.style==="ok" ? "on-ok" : "on-warn";
        cb(b.dataset.v);
        if(reveal){
          var r=document.getElementById(reveal);
          if(b.dataset.v==="有問題"||b.dataset.v==="未完成") r.classList.add("show");
          else r.classList.remove("show");
        }
      });
    });
  }
  bindSeg("segQ","qReveal",function(v){qVal=v;});
  bindSeg("segHw","hwReveal",function(v){hwVal=v;});

  // confirm checkbox
  var confirmed=false, confirmEl=document.getElementById("confirm");
  confirmEl.addEventListener("click",function(){confirmed=!confirmed;confirmEl.classList.toggle("on",confirmed);});

  // signature pad
  var canvas=document.getElementById("sig"), ctx=canvas.getContext("2d"), drawing=false, hasSig=false, ph=document.getElementById("sigPh");
  function fitCanvas(){
    var r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr; canvas.height=r.height*dpr;
    ctx.scale(dpr,dpr); ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.lineWidth=2.5; ctx.strokeStyle="#4A3A2A";
  }
  setTimeout(fitCanvas,50);
  function pos(e){
    var r=canvas.getBoundingClientRect();
    var t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function down(e){e.preventDefault();drawing=true;hasSig=true;ph.style.display="none";var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){if(!drawing)return;e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function up(){drawing=false;}
  canvas.addEventListener("mousedown",down);canvas.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  canvas.addEventListener("touchstart",down,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});canvas.addEventListener("touchend",up);
  document.getElementById("sigClear").addEventListener("click",function(){ctx.clearRect(0,0,canvas.width,canvas.height);hasSig=false;ph.style.display="block";});

  // gather + validate
  function gather(){
    var g=document.getElementById("grade").value.trim();
    var n=document.getElementById("name").value.trim();
    var d=document.getElementById("date").value;
    var u=document.getElementById("unit").value.trim();
    var st=startEl.value, en=endEl.value;
    var miss=[];
    if(!g)miss.push("班級");if(!n)miss.push("姓名");if(!d)miss.push("日期");if(!u)miss.push("課程單元");
    if(!st||!en)miss.push("看影片時間");if(!qVal)miss.push("影片問題");if(!hwVal)miss.push("作業狀態");
    if(!hasSig)miss.push("家長簽名");if(!confirmed)miss.push("家長確認");
    if(hwVal==="未完成" && !document.getElementById("hwDate").value)miss.push("預計完成日");
    return {g:g,n:n,d:d,u:u,st:st,en:en,miss:miss,
      dur:durEl.textContent.replace("⏱ ",""),
      qText:document.getElementById("qText").value.trim(),
      hwDate:document.getElementById("hwDate").value};
  }

  function textSummary(x){
    var L=[];
    L.push("【SUNNY魔法數學 · 補課回報】");
    L.push("班級："+x.g);
    L.push("姓名："+x.n);
    L.push("日期："+x.d);
    L.push("單元："+x.u);
    L.push("看片："+x.st+"～"+x.en+(x.dur?"（"+x.dur+"）":""));
    L.push("影片問題："+(qVal==="有問題"?("有 — "+(x.qText||"（未填寫）")):"沒有問題"));
    L.push("作業："+(hwVal==="未完成"?("未完成，預計 "+x.hwDate+" 完成"):"已完成"));
    L.push("家長確認：已確認 ✓");
    return L.join("\n");
  }

  function showErr(miss){
    document.getElementById("err").textContent = "還沒填：" + miss.join("、");
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  }

  // copy text
  document.getElementById("btnCopy").addEventListener("click",function(){
    var x=gather();
    if(x.miss.length){showErr(x.miss);return;}
    document.getElementById("err").textContent="";
    var txt=textSummary(x);
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert("已複製！可貼到 LINE 傳給老師 ☀️");},fallback);}
    else fallback();
    function fallback(){
      var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");alert("已複製！可貼到 LINE 傳給老師 ☀️");}catch(e){prompt("請長按複製：",txt);}
      document.body.removeChild(ta);
    }
  });

  // build capture card rows
  function buildCapture(x){
    var rows="";
    function row(k,v,cls){return '<div class="row"><div class="k">'+k+'</div><div class="v'+(cls?" "+cls:"")+'">'+v+'</div></div>';}
    rows+=row("班級",x.g);
    rows+=row("姓名",x.n);
    rows+=row("日期",x.d);
    rows+=row("課程單元",x.u);
    rows+=row("看片時間",x.st+" ～ "+x.en+(x.dur?"　("+x.dur+")":""));
    rows+= qVal==="有問題"
      ? row("影片問題","有 — "+(x.qText||"（未填寫）"),"warn")
      : row("影片問題","沒有問題 ✓","ok");
    rows+= hwVal==="未完成"
      ? row("作業","未完成，預計 "+x.hwDate+" 完成","warn")
      : row("作業","已完成 ✓","ok");
    document.getElementById("capRows").innerHTML=rows;
    document.getElementById("capSig").src=canvas.toDataURL();
    document.getElementById("capFoot").textContent="家長已確認 ✓　·　SUNNY魔法數學 ☀️";
  }

  // generate image
  document.getElementById("btnImg").addEventListener("click",function(){
    var x=gather();
    if(x.miss.length){showErr(x.miss);return;}
    document.getElementById("err").textContent="";
    buildCapture(x);
    var node=document.getElementById("capture");
    html2canvas(node,{backgroundColor:"#FFF8EC",scale:2}).then(function(cv){
      cv.toBlob(function(blob){
        var fname="補課回報_"+x.g+"_"+x.n+"_"+x.d+".png";
        var file=new File([blob],fname,{type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:"補課回報單"}).catch(function(){downloadImg(cv,fname);});
        } else downloadImg(cv,fname);
      });
    });
  });
  function downloadImg(cv,fname){
    var a=document.createElement("a");a.download=fname;a.href=cv.toDataURL("image/png");
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){alert("圖片已存到手機！請到 LINE 選這張圖傳給老師 ☀️");},300);
  }
})();
</script>
</body>
</html>
